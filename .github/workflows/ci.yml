name: core
on:
  push:
    branches: ['**']
    tags-ignore: ['engineering-*']
  pull_request:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain and dependencies
        run: |
          test "$(go env GOVERSION)" = "go1.27.2"
          go mod verify
      - name: Native Windows permission and shutdown regression
        if: runner.os == 'Windows'
        run: |
          mkdir -p evidence
          set -o pipefail
          go test -json -count=10 -timeout 3m ./internal/cli -run '^TestSupervisorShutdownRetriesActualWindowsPermissionWithoutClaimingAbsence$' | tee evidence/windows-permission.jsonl
      - name: Formatting and vet
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Reachable vulnerability scan
        run: |
          mkdir -p evidence
          set -o pipefail
          python scripts/pinned-tools.py > evidence/pinned-tools.json
          task_vuln_tool="$(python scripts/pinned-tools.py --govulncheck)"
          go run "$task_vuln_tool" ./... | tee evidence/govulncheck.txt
      - name: Evidence validator identity and gap contract
        run: |
          python scripts/test-evidence-validator.py
          python scripts/test-portable-package.py
          python scripts/test-engineering-release.py
          python scripts/test-native-onboarding-metadata.py
          python scripts/test-native-test-shards.py
          python scripts/retrieval-evaluation.py --self-test
      - name: Full tests
        run: |
          mkdir -p evidence
          set -o pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/native-test-shards.py --agent-shards 16 --workers 4 | tee evidence/tests.jsonl
          elif [[ "$RUNNER_OS" == Linux ]]; then
            go test -coverprofile evidence/coverage.out -json -count=1 -timeout 15m ./... | tee evidence/tests.jsonl
          else
            go test -json -count=1 -timeout 15m ./... | tee evidence/tests.jsonl
          fi
          vault_args=()
          if [[ "$RUNNER_OS" == Windows ]]; then vault_args+=(--native-ntfs); fi
          if [[ "$RUNNER_OS" != Windows ]]; then vault_args+=(--vault-failure); fi
          python scripts/verify-test-results.py evidence/tests.jsonl --privacy --retrieval --delivery "${vault_args[@]}"
      - name: Linux statement coverage visibility
        if: runner.os == 'Linux' && always()
        run: |
          python scripts/test-coverage-summary.py
          go_version="$(go env GOVERSION)"
          if [[ -s evidence/coverage.out ]]; then
            mkdir -p .cache
            if go list -json ./... > .cache/coverage-packages.json; then
              python scripts/summarize-coverage.py --profile evidence/coverage.out --packages .cache/coverage-packages.json --tests evidence/tests.jsonl --revision "$GITHUB_SHA" --go-version "$go_version" --output evidence/coverage.json
            else
              python scripts/summarize-coverage.py --tests evidence/tests.jsonl --revision "$GITHUB_SHA" --unavailable-reason 'package inventory could not be collected' --go-version "$go_version" --output evidence/coverage.json
            fi
          else
            python scripts/summarize-coverage.py --tests evidence/tests.jsonl --revision "$GITHUB_SHA" --unavailable-reason 'coverage profile was not produced' --go-version "$go_version" --output evidence/coverage.json
          fi
      - name: Migration regression
        run: |
          set -o pipefail
          python scripts/migration-regression.py | tee evidence/migration.jsonl
          python scripts/verify-test-results.py evidence/migration.jsonl --migration
      - run: go build -trimpath ./cmd/viber
      - name: Native terminal slash, resize and detach journey
        run: |
          set -o pipefail
          task_viber_binary='./viber'
          if [[ "$RUNNER_OS" == Windows ]]; then task_viber_binary='./viber.exe'; fi
          python scripts/native-tui-smoke.py --binary "$task_viber_binary" --revision '${{ github.sha }}' | tee evidence/tui-journey.json
      - name: Native offline onboarding wizard journey
        run: |
          set -o pipefail
          task_viber_binary='./viber'
          if [[ "$RUNNER_OS" == Windows ]]; then task_viber_binary='./viber.exe'; fi
          python scripts/native-onboarding-smoke.py --binary "$task_viber_binary" --revision '${{ github.sha }}' | tee evidence/onboarding-journey.json
      - run: go run ./cmd/viber doctor --json
      - name: Race detector
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          # Discover all packages and Test/Fuzz/Example parents; no omissions.
          # Keep owner first and CLI/owner serial, then bound the large agent
          # package in four instrumented shards with at most two workers.
          python scripts/native-test-shards.py --race | tee evidence/race.jsonl
          python scripts/verify-test-results.py evidence/race.jsonl --privacy --retrieval --delivery --vault-failure
      - name: All fuzz targets
        if: runner.os == 'Linux'
        run: bash scripts/fuzz.sh evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
  docker:
    # Independent native runtime acceptance runs in parallel. Foundation and
    # every signer/publication still require both this job and all test jobs.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      VIBER_DOCKER_TEST_IMAGE: public.ecr.aws/docker/library/golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Real Docker acceptance
        shell: bash
        env:
          VIBER_QUOTA_DIAGNOSTICS: '1'
        run: |
          mkdir -p evidence
          docker version > evidence/docker-version.txt
          docker info > evidence/docker-info.txt
          # Pulling an immutable test image is idempotent. Bound registry
          # retries, preserve the digest, and fail before tests if unavailable.
          task_image_ready=false
          for attempt in 1 2 3; do
            if docker pull "$VIBER_DOCKER_TEST_IMAGE"; then task_image_ready=true; break; fi
            if [[ "$attempt" != 3 ]]; then sleep "$((attempt * 5))"; fi
          done
          if [[ "$task_image_ready" != true ]]; then
            VIBER_DOCKER_TEST_IMAGE="docker.io/library/golang:1.27.2-bookworm@${VIBER_DOCKER_TEST_IMAGE##*@}"
            export VIBER_DOCKER_TEST_IMAGE
            for attempt in 1 2 3; do
              if docker pull "$VIBER_DOCKER_TEST_IMAGE"; then task_image_ready=true; break; fi
              if [[ "$attempt" != 3 ]]; then sleep "$((attempt * 5))"; fi
            done
          fi
          [[ "$task_image_ready" == true ]]
          printf '%s\n' "$VIBER_DOCKER_TEST_IMAGE" > evidence/selected-image.txt
          docker build --build-arg "VIBER_GRAPH_BUILDER_IMAGE=$VIBER_DOCKER_TEST_IMAGE" --tag viber-go-graph-helper:ci --file tools/go-graph-helper/Dockerfile .
          VIBER_GO_GRAPH_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' viber-go-graph-helper:ci)"
          [[ "$VIBER_GO_GRAPH_TEST_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          export VIBER_GO_GRAPH_TEST_IMAGE
          set -o pipefail
          go test -p 1 -json -count=1 -timeout 15m ./internal/intelligence ./internal/runner ./internal/cli ./internal/agent ./internal/evaluation ./internal/extensions ./internal/resource ./internal/distribution ./internal/model | tee evidence/docker.jsonl
          python3 scripts/verify-test-results.py evidence/docker.jsonl --docker --delivery
      - name: Bounded physical filesystem pressure
        shell: bash
        run: bash scripts/disk-pressure-acceptance.sh evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
  vault:
    # These disposable vault fixtures do not consume test-job artifacts.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Disposable Linux desktop vault dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools
      - name: Real native vault acceptance
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- bash scripts/vault-acceptance.sh evidence
          else
            bash scripts/vault-acceptance.sh evidence
          fi
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
  rootless:
    # Diagnose host/package/delegation failures alongside the core suites.
    # Foundation still requires both rootless and every core/native job.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Delegated cgroup rootless acceptance and real daemon restart
        shell: bash
        run: bash scripts/rootless-systemd-acceptance.sh --allow-configure-disposable-github-hosted-runner evidence
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rootless-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
  foundation:
    if: always()
    needs: [test, docker, vault, rootless]
    runs-on: ubuntu-latest
    steps:
      - name: Require every foundation job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          VAULT_RESULT: ${{ needs.vault.result }}
          ROOTLESS_RESULT: ${{ needs.rootless.result }}
        run: test "$TEST_RESULT" = success && test "$DOCKER_RESULT" = success && test "$VAULT_RESULT" = success && test "$ROOTLESS_RESULT" = success
  packages:
    # Fork/PR code receives no signing authority. Build/smoke is separated from
    # the signer, which only downloads archives and never executes a binary.
    # Unsigned native builds overlap foundation checks; attest-packages still
    # requires a successful foundation before any signing authority is used.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ixayldz/Viber'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Frozen native engineering package and first offline task
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:GOMODCACHE=Join-Path (Get-Location) '.cache/go-mod'
          $env:GOCACHE=Join-Path (Get-Location) '.cache/go-build'
          go mod download
          if($LASTEXITCODE-ne 0){throw 'Pinned dependency download failed'}
          $taskTarget=(& go env GOOS).Trim()+'/'+(& go env GOARCH).Trim()
          if($LASTEXITCODE-ne 0 -or $taskTarget-notin @('windows/amd64','linux/amd64','darwin/arm64')){throw 'Unsupported native package host'}
          ./scripts/package.ps1 -Revision $env:GITHUB_SHA -Output .cache/native-bundle -Targets @($taskTarget)
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          python scripts/portable-package.py --bundle .cache/native-bundle --output evidence/portable --revision $env:GITHUB_SHA
          if($LASTEXITCODE-ne 0){throw 'Native portable package acceptance failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-${{ matrix.os }}-${{ github.sha }}
          path: evidence/portable/
          if-no-files-found: error
  attest-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ixayldz/Viber'
    needs: [foundation, packages]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*-${{ github.sha }}
          path: packages
          merge-multiple: false
      - name: Require three native archives and three installation descriptors
        shell: bash
        run: |
          shopt -s globstar nullglob
          archives=(packages/**/*.zip packages/**/*.tar.gz)
          test "${#archives[@]}" = 3
          descriptors=(packages/**/distribution.json)
          test "${#descriptors[@]}" = 3
      - name: Attest immutable portable archives and native installation descriptors
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            packages/**/*.zip
            packages/**/*.tar.gz
            packages/**/distribution.json
      - name: Verify consumer repo, workflow, source ref and exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          subjects=(packages/**/*.zip packages/**/*.tar.gz packages/**/distribution.json)
          test "${#subjects[@]}" = 6
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" -R ixayldz/Viber --signer-workflow ixayldz/Viber/.github/workflows/ci.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-provenance-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
  installed-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ixayldz/Viber'
    needs: attest-packages
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-${{ matrix.os }}-${{ github.sha }}
          path: .cache/installer-download
      - name: Actual native installer, first task, registered rollback and owned uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $bootstrap=Join-Path (Get-Location) '.cache/installer-bootstrap'
          if($IsWindows){$bootstrap+='.exe'}
          go build -trimpath -o $bootstrap ./cmd/viber
          if($LASTEXITCODE-ne 0){throw 'Native bootstrap build failed'}
          $archives=@(Get-ChildItem -LiteralPath .cache/installer-download -File | Where-Object {$_.Name.EndsWith('.zip') -or $_.Name.EndsWith('.tar.gz')})
          if($archives.Count-ne 1){throw 'Exactly one native archive required'}
          $baseline=Get-Content -LiteralPath scripts/upgrade-baseline.json -Raw | ConvertFrom-Json
          if($baseline.schema_version-ne 1){throw 'Unsupported upgrade baseline schema'}
          $baselineArgs=@()
          if($null-ne $baseline.revision){
            $baselineRevision=[string]$baseline.revision
            if($baselineRevision-cnotmatch '^[0-9a-f]{40}$' -or $baselineRevision-eq $env:GITHUB_SHA){throw 'Distinct exact baseline SHA required'}
            $native=if($IsWindows){'windows-amd64.zip'}elseif($IsMacOS){'darwin-arm64.tar.gz'}else{'linux-amd64.tar.gz'}
            $asset='viber-'+$baselineRevision.Substring(0,12)+'-'+$native
            $baselineDirectory=Join-Path (Get-Location) '.cache/installer-baseline'
            $taskBaselineFetched=$false
            for($taskBaselineAttempt=1; $taskBaselineAttempt-le 3; $taskBaselineAttempt++){
              gh release download ('engineering-'+$baselineRevision) --repo ixayldz/Viber --pattern $asset --dir $baselineDirectory --clobber
              if($LASTEXITCODE-eq 0){$taskBaselineFetched=$true; break}
              if($taskBaselineAttempt-lt 3){Start-Sleep -Seconds (2*$taskBaselineAttempt)}
            }
            if(-not $taskBaselineFetched){throw 'Exact public upgrade baseline download failed after bounded retries'}
            $baselineArgs=@('--baseline-archive',(Join-Path $baselineDirectory $asset),'--baseline-revision',$baselineRevision)
          }
          python scripts/installed-package-acceptance.py --bootstrap $bootstrap --archive $archives[0].FullName --revision $env:GITHUB_SHA --output evidence/installation @baselineArgs
          if($LASTEXITCODE-ne 0){throw 'Native managed installer acceptance failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-${{ matrix.os }}-${{ github.sha }}
          path: evidence/installation/installation.json
          if-no-files-found: error
  attest-installation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ixayldz/Viber'
    needs: installed-packages
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installation-*-${{ github.sha }}
          path: installation
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: installation/**/installation.json

name: core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -count=1 ./...
      - run: go build -trimpath ./cmd/viber
      - run: go run ./cmd/viber doctor --json
      - name: Formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Encoding fuzz
        if: runner.os == 'Linux'
        run: go test ./internal/contracts -run '^$' -fuzz FuzzStrictDecode -fuzztime 10s
      - name: Git index fuzz
        if: runner.os == 'Linux'
        run: go test ./internal/workspace -run '^$' -fuzz FuzzGitIndex -fuzztime 10s
      - name: Offline Docker engineering profile
        if: runner.os == 'Linux'
        env:
          VIBER_DOCKER_TEST_IMAGE: golang:1.27.1-bookworm@sha256:8d48e12ec56735e9358640898b9d9b9fcca110612ed8a5567438c0a1baa24e66
        run: |
          docker pull "$VIBER_DOCKER_TEST_IMAGE"
          go test -count=1 ./internal/runner ./internal/cli ./internal/agent
